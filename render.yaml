# Render Blueprint for the VYBZ API and website (apps/web) plus its database.
# Test deployment: demo catalog on, email verification off. See README "Deploying".
databases:
  - name: vybz-db
    plan: basic-256mb
    region: virginia
    postgresMajorVersion: "16"
    databaseName: vybz_db
    user: vybz_db_user
    diskSizeGB: 1

services:
  - type: web
    name: vybz
    runtime: node
    region: virginia
    plan: starter
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm turbo run build --filter=@vybz/web
    # Apply pending migrations, then serve. Next reads PORT from Render.
    startCommand: pnpm --filter @vybz/db migrate && pnpm --filter @vybz/web start
    healthCheckPath: /api/v1/config
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: vybz-db
          property: connectionString
      - key: BETTER_AUTH_SECRET
        generateValue: true
      - key: CRON_SECRET
        generateValue: true
      - key: VYBZ_DEMO_CATALOG
        value: "true"
      - key: AUTH_REQUIRE_EMAIL_VERIFICATION
        value: "false"
      - key: PUSH_NOTIFICATIONS
        value: "true"
